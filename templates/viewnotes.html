{% extends "base.html" %}

{% block title %}View Note - SNS{% endblock %}

{% block content %}

<div class="note-card">
    <h1>{{ title }}</h1>

    <p>{{ content }}</p>

    <div class="note-actions">
        <a href="{{ url_for('edit_notes', note_id=notes['id']) }}"
           class="btn btn-edit">
            Edit
        </a>

        <a href="{{ url_for('mynotes') }}"
           class="btn btn-secondary">
            Back
        </a>
    </div>
</div>

{% endblock %}
