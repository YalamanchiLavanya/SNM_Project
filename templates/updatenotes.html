<div class="form-container">

    <h1>Update Notes</h1>
    <p class="form-subtitle">Update Your Notes for Your Reference</p>

    <form action="{{ url_for('edit_notes', note_id=notes_id) }}"
          method="POST">

        <div class="form-group">
            <label for="title">Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter your Notes Title"
                value="{{ title }}"
                required>
        </div>

        <div class="form-group">
            <label for="content">Content</label>

            <textarea
                rows="5"
                cols="50"
                id="content"
                name="content"
                placeholder="Enter your Notes Content"
                required>{{ content }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary full-width">
            Update Notes
        </button>

    </form>

</div>

{% endblock %}
