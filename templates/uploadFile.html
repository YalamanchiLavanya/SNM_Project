{% extends "base.html" %}
{% block title %}
uPload Files - SNS
{% endblock %}
{% block content %}

<div class="form-container">
    <h1>Upload Files</h1>
    <p class="form-subtitle">Upload New Files for Your Reference</p>
    <form action="/files/upload"
     method="POST"
    enctype ="multipart/form-data">

<div class="form-group">
    <label>File</label>
    <input type="file"
           id="file"
           name="File"
           placeholder="Enter your File Title"
           required>
    <br><br>
    <button type="submit">Upload File</button>
</div>
</form>
    </div>     
{% endblock %}
