{% extends "base.html" %}

{% block title %}
Reset Password- SNS
{% endblock %}

{% block nav %}
  <a href="{{ url_for('home')}}">Home</a>
  <a href="{{ url_for('register')}}">Register</a>
  <a href="{{ url_for('login')}}">Login</a>
{% endblock %}  


{% block content %}

<div class="form-container">
    <h1>Reset Password</h1>
    <p class="from-subtitle">
        Reset Password to Access your Notes Account
    </p>
    <form
        method="POST"
        action="/reset_password/{{token}}">

        <div class="form-group">
            <label for="New_password">
                New Password
            </label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter your new password"
                required >
        </div>

         <div class="form-group">
            <label for="confirm_password">
                 Confrim New Password
            </label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confrim your Password"
                required >
        </div>
        <button
            type="submit"
            class="btn btn-primary full-width">Reset Password</button>
    </form>
</div>
{% endblock %}
