<div class="form-container">
    <h1>Add Notes</h1>
    <p class="form-subtitle">Add New Notes for Your Reference</p>
    <form action="/notes/addnotes" method="POST">

    <label>Title</label>
    <input type="text"
           name="Title"
           placeholder="Enter your Notes Title"
           required>

    <br><br>

    <label>Content</label>
    <textarea name="content"
              required></textarea>

    <br><br>

    <button type="submit">Save Notes</button>

</form>
